<!doctype html>
<html lang="pl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Optymalizator Tartaku v0.7</title>
    <style>
        :root {
            --bg: #111827;
            --panel: #1f2937;
            --panel2: #273449;
            --text: #f3f4f6;
            --muted: #aab4c3;
            --accent: #eab308;
            --danger: #ef4444;
            --line: #4b5563;
            --wood: #d8a85e;
            --wood2: #f1cf91
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif
        }

        header {
            padding: 18px 22px;
            border-bottom: 1px solid #334155;
            background: #0f172a
        }

        h1 {
            margin: 0;
            font-size: 22px
        }

        header p {
            margin: 5px 0 0;
            color: var(--muted)
        }

        main {
            display: grid;
            grid-template-columns: 340px 1fr;
            min-height: calc(100vh - 82px)
        }

        aside {
            padding: 16px;
            background: var(--panel);
            border-right: 1px solid #334155;
            overflow: auto
        }

        .field {
            margin-bottom: 12px
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 5px
        }

        input,
        select,
        button {
            font: inherit
        }

        input,
        select {
            width: 100%;
            padding: 9px 10px;
            background: #111827;
            color: var(--text);
            border: 1px solid #475569;
            border-radius: 7px
        }

        button {
            border: 0;
            border-radius: 7px;
            padding: 10px 12px;
            font-weight: 700;
            cursor: pointer
        }

        .primary {
            background: var(--accent);
            color: #111827;
            width: 100%
        }

        .secondary {
            background: #374151;
            color: white
        }

        .danger {
            background: #7f1d1d;
            color: white
        }

        .row {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr .75fr auto;
            gap: 6px;
            align-items: end;
            margin-bottom: 8px
        }

        .row input {
            min-width: 0
        }

        .remove {
            padding: 8px 9px
        }

        .board-head {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr .75fr auto;
            gap: 6px;
            color: var(--muted);
            font-size: 11px;
            margin: 10px 0 5px
        }

        .hint {
            font-size: 12px;
            color: var(--muted);
            margin: 8px 0 14px
        }

        .actions {
            display: grid;
            gap: 8px;
            margin-top: 12px
        }

        .content {
            padding: 16px;
            display: grid;
            grid-template-rows: minmax(480px, 1fr) auto;
            gap: 14px;
            min-width: 0
        }

        .canvas-wrap {
            background: #f8fafc;
            border-radius: 10px;
            min-height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid #475569
        }

        .canvas-wrap canvas {
            max-width: 100%;
            max-height: 100%;
            width: 100%;
            height: 100%
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px
        }

        .stat {
            background: var(--panel);
            padding: 11px;
            border-radius: 8px;
            border: 1px solid #334155
        }

        .stat b {
            display: block;
            font-size: 18px
        }

        .stat span {
            color: var(--muted);
            font-size: 12px
        }

        .bottom {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px
        }

        .box {
            background: var(--panel);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            overflow: auto;
            max-height: 270px
        }

        .box h2 {
            font-size: 15px;
            margin: 0 0 8px
        }

        .box table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px
        }

        .box th,
        .box td {
            padding: 6px;
            border-bottom: 1px solid #334155;
            text-align: left
        }

        .tag {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 5px;
            background: #374151
        }

        .legend {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 12px;
            color: #334155;
            background: #fff;
            padding: 5px 8px;
            position: absolute;
            margin: 10px;
            border-radius: 6px
        }

        .empty {
            color: #64748b;
            text-align: center;
            padding: 20px
        }

        .notice {
            background: #3f2d04;
            border: 1px solid #806000;
            color: #f8e7a4;
            padding: 9px;
            border-radius: 7px;
            font-size: 12px;
            margin-top: 12px
        }

        .ok {
            background: #064e3b;
            border-color: #047857;
            color: #d1fae5
        }

        .error {
            background: #450a0a;
            border-color: #991b1b;
            color: #fecaca
        }

        @media(max-width:900px) {
            main {
                grid-template-columns: 1fr
            }

            aside {
                border-right: 0;
                border-bottom: 1px solid #334155
            }

            .content {
                grid-template-rows: 520px auto
            }

            .stats {
                grid-template-columns: repeat(2, 1fr)
            }

            .bottom {
                grid-template-columns: 1fr
            }

            .row,
            .board-head {
                grid-template-columns: 1.1fr .8fr .8fr .7fr auto
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Optymalizator Tartaku — układ desek w pniu</h1>
    </header>
    <main>
        <aside>
            <div class="field"><label for="diameter">Średnica pnia (mm)</label><input id="diameter" type="number"
                    min="50" step="1" value="400"></div>
            <div class="field"><label for="kerf">Rzaz piły (mm)</label><input id="kerf" type="number" min="0" step="0.1"
                    value="2.2"></div>
            <div class="field"><label for="overhang">Maks. wystawanie poza okrąg (%)</label><input id="overhang"
                    type="number" min="0" max="10" step="0.1" value="1.3"></div>
            <div class="field"><label for="quality">Dokładność wyszukiwania</label><select id="quality">
                    <option value="quick">Szybka</option>
                    <option value="balanced" selected>Zrównoważona</option>
                    <option value="deep">Dokładna</option>
                </select></div>
            <h3>Wymiary desek</h3>
            <div class="board-head">
                <span>Nazwa</span><span>Szer.</span><span>Grub.</span><span>Ilość</span><span></span></div>
            <div id="boards"></div>
            <button class="secondary" id="add">+ Dodaj wymiar</button>
            <div class="actions"><button class="primary" id="optimize">Optymalizuj pień</button><button
                    class="secondary" id="svg">Eksportuj SVG</button><button class="danger" id="reset">Reset</button>
            </div>
        </aside>
        <section class="content">
            <div class="canvas-wrap"><canvas id="canvas" width="900" height="650"></canvas></div>
            <div>
                <div class="stats">
                    <div class="stat"><b id="placed">0 / 0</b><span>deski wykorzystane</span></div>
                    <div class="stat"><b id="util">0%</b><span>pokrycie pola pnia</span></div>
                    <div class="stat"><b id="waste">0%</b><span>obszar poza deskami</span></div>
                    <div class="stat"><b id="over">0 mm</b><span>maks. wystawanie</span></div>
                    <div class="stat"><b id="cuts">0</b><span>rzeczywistych linii cięcia</span></div>
                </div>
<!--                 <div class="bottom" style="margin-top:14px">
                    <div class="box">
                        <h2>Rozmieszczenie</h2>
                        <div id="summary" class="empty">Wprowadź wymiary i uruchom optymalizację.</div>
                    </div>
                    <div class="box">
                        <h2>Priorytet cięcia</h2>
                        <div id="sequence" class="empty">Największe elementy są planowane w centrum.</div>
                    </div>
                </div>
 -->            </div>
        </section>
    </main>
    <script>
        'use strict';
        const $ = id => document.getElementById(id);
        let result = null;
        const defaults = [['50×175', 175, 50, 4], ['45×170', 170, 45, 8], ['32×100', 100, 32, 4]];
        function addRow(v = ['Nowa', 120, 40, 1]) {const d = document.createElement('div'); d.className = 'row'; d.innerHTML = `<input class="name" value="${v[0]}"><input class="w" type="number" min="1" value="${v[1]}"><input class="t" type="number" min="1" value="${v[2]}"><input class="q" type="number" min="1" value="${v[3]}"><button class="danger remove">×</button>`; $('boards').appendChild(d); d.querySelector('.remove').onclick = () => d.remove()}
        defaults.forEach(addRow); $('add').onclick = () => addRow();
        function inputs() {return [...document.querySelectorAll('#boards .row')].map((r, i) => ({id: i, name: r.querySelector('.name').value || `Deska ${i + 1}`, w: +r.querySelector('.w').value, t: +r.querySelector('.t').value, q: Math.max(0, Math.floor(+r.querySelector('.q').value || 0))})).filter(x => x.w > 0 && x.t > 0 && x.q > 0)}
        function rectInsideCircle(r, R, eps = 0) {const pts = [[r.x - r.w / 2, r.y - r.h / 2], [r.x + r.w / 2, r.y - r.h / 2], [r.x - r.w / 2, r.y + r.h / 2], [r.x + r.w / 2, r.y + r.h / 2]]; return pts.every(p => Math.hypot(p[0], p[1]) <= R + eps)}

        function anchorCandidates(placed, r, gap, R) {

            const add = (v, s) => {if (Number.isFinite(v)) s.add(Math.round(v * 10) / 10)};
            placed.forEach(q => {
                add(q.x, xs); add(q.x - q.w / 2 - r.w / 2 - gap, xs); add(q.x + q.w / 2 + r.w / 2 + gap, xs);
                add(q.x + (q.w - r.w) / 2, xs); add(q.x - (q.w - r.w) / 2, xs);
                add(q.y, ys); add(q.y - q.h / 2 - r.h / 2 - gap, ys); add(q.y + q.h / 2 + r.h / 2 + gap, ys);

            const out = []; for (const x of xs) for (const y of ys) out.push([x, y]); return out;
        }
        function sameStockRunScore(r, placed, gap) {
            let s = 0;
            for (const q of placed) {
                if (q.w !== r.w || q.h !== r.h) continue;
                const vy = intervalsOverlap(r.y - r.h / 2, r.y + r.h / 2, q.y - q.h / 2, q.y + q.h / 2);
                const hx = intervalsOverlap(r.x - r.w / 2, r.x + r.w / 2, q.x - q.w / 2, q.x + q.w / 2);
                const gx = edgeGap(r, q, 'x'), gy = edgeGap(r, q, 'y');

                if (hx && gy >= gap - 0.8 && gy <= gap + 3) s += 900;

                if (hx && gy < 18) s += 300;
            }
            return s;
        }
        function alignmentScore(r, placed, gap) {
            let shared = 0, near = 0;
            const re = {l: r.x - r.w / 2, r: r.x + r.w / 2, t: r.y - r.h / 2, b: r.y + r.h / 2};
            for (const q of placed) {
                const qe = {l: q.x - q.w / 2, r: q.x + q.w / 2, t: q.y - q.h / 2, b: q.y + q.h / 2};
                const xProj = intervalsOverlap(re.t, re.b, qe.t, qe.b), yProj = intervalsOverlap(re.l, re.r, qe.l, qe.r);
                const tol = Math.max(1.2, gap * 0.55);
                if (xProj) for (const a of [re.l, re.r]) for (const b of [qe.l, qe.r]) {const d = Math.abs(a - b); if (d < tol) shared += 120 + (tol - d) * 20}
                if (yProj) for (const a of [re.t, re.b]) for (const b of [qe.t, qe.b]) {const d = Math.abs(a - b); if (d < tol) shared += 120 + (tol - d) * 20}
                const gx = edgeGap(r, q, 'x'), gy = edgeGap(r, q, 'y');
                if (xProj && gx >= gap - 0.8 && gx <= gap + 3) near += 60;
                if (yProj && gy >= gap - 0.8 && gy <= gap + 3) near += 60;
            }
            return shared + near;
        }
        // Budowanie fizycznej mapy cięcia. Sprawdzanie czy przyległe krawędzie należą do tego samego cięcia.
        function cutPlan(placed, kerf) {
            const tol = Math.max(0.75, kerf + 0.45);
            const collect = (axis) => {
                const raw = [];
                for (const p of placed) {
                    if (axis === 'v') {
                        raw.push({x: p.x - p.w / 2, a: p.y - p.h / 2, b: p.y + p.h / 2});
                        raw.push({x: p.x + p.w / 2, a: p.y - p.h / 2, b: p.y + p.h / 2});
                    } else {
                        raw.push({x: p.y - p.h / 2, a: p.x - p.w / 2, b: p.x + p.w / 2});
                        raw.push({x: p.y + p.h / 2, a: p.x - p.w / 2, b: p.x + p.w / 2});
                    }
                }
                raw.sort((a, b) => a.x - b.x);
                const groups = [];
                for (const e of raw) {
                    let g = groups[groups.length - 1];
                    if (!g || Math.abs(e.x - g.x) > tol) {g = {x: e.x, edges: [], a: Infinity, b: -Infinity}; groups.push(g)}
                    else {g.x = (g.x * g.edges.length + e.x) / (g.edges.length + 1)}
                    g.edges.push(e); g.a = Math.min(g.a, e.a); g.b = Math.max(g.b, e.b);
                }
                return groups;
            };
            const vertical = collect('v'), horizontal = collect('h');
            const lines = vertical.length + horizontal.length;
            const shared = vertical.reduce((n, g) => n + Math.max(0, g.edges.length - 1), 0) + horizontal.reduce((n, g) => n + Math.max(0, g.edges.length - 1), 0);
            const length = vertical.reduce((n, g) => n + Math.max(0, g.b - g.a), 0) + horizontal.reduce((n, g) => n + Math.max(0, g.b - g.a), 0);

        }
        function cutContinuityScore(r, placed, gap) {
            if (!placed.length) return 0;
            const plan = cutPlan(placed.concat(r), gap);

            return Math.max(0, (old.lines + 1) - plan.lines) * 900 + Math.max(0, plan.shared - old.shared) * 260;
        }
        function compact(placed, R, gap, allow, passes) {
            let changed = true;
            for (let pass = 0; pass < passes && changed; pass++) {
                changed = false;
                for (let i = 0; i < placed.length; i++) {
                    const r = placed[i], others = placed.filter((_, j) => j !== i), targets = [];
                    for (const q of others) {
                        targets.push([q.x + (q.w + r.w) / 2 + gap, q.y], [q.x - (q.w + r.w) / 2 - gap, q.y]);
                        targets.push([q.x, q.y + (q.h + r.h) / 2 + gap], [q.x, q.y - (q.h + r.h) / 2 - gap]);
                        targets.push([q.x + (q.w - r.w) / 2, r.y], [q.x - (q.w - r.w) / 2, r.y]);
                        targets.push([r.x, q.y + (q.h - r.h) / 2], [r.x, q.y - (q.h - r.h) / 2]);
                    }
                    targets.push([0, r.y], [r.x, 0]);
                    let best = r, bestScore = layoutLocalScore(r, others, R, gap, allow);
                    for (const [x, y] of targets) {const c = {...r, x, y}; if (!feasible(c, others, R, gap, allow)) continue; const sc = layoutLocalScore(c, others, R, gap, allow); if (sc > bestScore + 0.01) {best = c; bestScore = sc} }
                    if (best !== r) {placed[i] = best; changed = true}
                }
            }

        }
        function layoutLocalScore(r, others, R, gap, allow) {
            if (!rectInsideCircle(r, R, allow) || others.some(p => overlap(r, p, gap))) return -1e12;
            const d = Math.hypot(r.x, r.y) / R;

        function buildPool(items) {
            const pool = []; items.forEach(it => {for (let n = 0; n < it.q; n++)pool.push({...it, idx: n})});
            // Największe na początek od środka okręgu, komplety o podobnych wymiarach blisko siebie.
            pool.sort((a, b) => (b.w * b.t - a.w * a.t) || (Math.max(b.w, b.t) - Math.max(a.w, a.t)) || a.name.localeCompare(b.name));
            return pool;
        }
        function runSearch(items, level) {
            const D = +$('diameter').value || 400, R = D / 2, allow = D * (+$('overhang').value || 0) / 100, kerf = Math.max(0, +$('kerf').value || 0), pool = buildPool(items);
            const iterations = level === 'quick' ? 160 : level === 'balanced' ? 600 : 1500;

            function attempt() {
                let placed = [];

                    const it = pool[i], ori = it.w === it.t ? [[it.w, it.t, 0]] : [[it.w, it.t, 0], [it.t, it.w, 90]];
                    const cand = anchorCandidates(placed, {w: it.w, h: it.t}, kerf, R), choices = [];
                    for (const [w, h, rot] of ori) {
                        for (const [x, y] of cand) {
                            const r = {...it, w, h, x, y, rot, area: w * h};
                            if (!feasible(r, placed, R, kerf, allow)) continue;
                            const d = Math.hypot(x, y) / R, rank = i / Math.max(1, pool.length - 1), target = Math.min(.96, rank * .90);
                            const plan = cutPlan(placed.concat(r), kerf);
                            const same = placed.filter(q => q.name === it.name && q.w === w && q.h === h).length;
                            let s = Math.abs(d - target) * 110 - r.area * .00012;
                            s -= alignmentScore(r, placed, kerf) * 4.5;
                            s -= cutContinuityScore(r, placed, kerf) * 8;
                            s -= same * 1100;
                            s += plan.lines * 42 + plan.length * .005;
                            s += Math.random() * 12;
                            choices.push({s, r});

                    }
                    if (!choices.length) continue;
                    choices.sort((a, b) => a.s - b.s);
                    const top = Math.min(choices.length, level === 'quick' ? 6 : level === 'balanced' ? 10 : 16);
                    placed.push(choices[Math.floor(Math.random() * top)].r);
                }
                placed = compact(placed, R, kerf, allow, level === 'quick' ? 2 : level === 'balanced' ? 4 : 6);

                const value = placed.length * 1e12 + area * 1e6 - plan.lines * 1e4 - plan.length;

            }

        }
        function draw(res) {
            const c = $('canvas'), ctx = c.getContext('2d'); ctx.clearRect(0, 0, c.width, c.height); ctx.fillStyle = '#f8fafc'; ctx.fillRect(0, 0, c.width, c.height); const pad = 55, scale = Math.min((c.width - pad * 2) / res.D, (c.height - pad * 2) / res.D), cx = c.width / 2, cy = c.height / 2; const X = x => cx + x * scale, Y = y => cy + y * scale;
            ctx.strokeStyle = '#334155'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, res.R * scale, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([7, 5]); ctx.strokeStyle = '#94a3b8'; ctx.beginPath(); ctx.arc(cx, cy, (res.R + res.allow) * scale, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
            ctx.globalAlpha = .13; for (let r = 25; r < res.R; r += 14) {ctx.beginPath(); ctx.arc(cx, cy, r * scale, 0, Math.PI * 2); ctx.strokeStyle = '#9a7b4f'; ctx.stroke()} ctx.globalAlpha = 1;
            // Rysowanie rzazu.

            res.placed.forEach((p, i) => {ctx.save(); ctx.translate(X(p.x), Y(p.y)); ctx.fillStyle = colors[i % colors.length]; ctx.strokeStyle = '#475569'; ctx.lineWidth = 1.2; ctx.fillRect(-p.w * scale / 2, -p.h * scale / 2, p.w * scale, p.h * scale); ctx.strokeRect(-p.w * scale / 2, -p.h * scale / 2, p.w * scale, p.h * scale); ctx.fillStyle = '#1f2937'; ctx.font = `${Math.max(9, Math.min(11, 11 * scale))}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; if (p.w * scale > 50 && p.h * scale > 24) ctx.fillText(`${p.name}`, 0, 0); ctx.restore()});
            // Wyświetlanie linii cięcia - kwestia do poprawy.
            /*
            ctx.lineWidth = Math.max(1.5, 2.4 * scale); ctx.strokeStyle = '#b45309'; ctx.globalAlpha = .8;
            const plan = res.plan || cutPlan(res.placed, res.kerf);
            for (const g of plan.vertical) {ctx.beginPath(); ctx.moveTo(X(g.x), Y(g.a)); ctx.lineTo(X(g.x), Y(g.b)); ctx.stroke()}
            for (const g of plan.horizontal) {ctx.beginPath(); ctx.moveTo(X(g.a), Y(g.x)); ctx.lineTo(X(g.b), Y(g.x)); ctx.stroke()}
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#334155'; ctx.font = '12px Arial'; ctx.textAlign = 'left'; ctx.fillText(`Ø ${res.D} mm | rzaz ${res.kerf} mm | +${res.allow.toFixed(1)} mm`, 12, c.height - 14);
            */
        }
        function updateUI(res) {
            const area = Math.PI * res.R * res.R, pa = res.placed.reduce((s, p) => s + p.area, 0); $('placed').textContent = `${res.placed.length} / ${res.requested}`; $('util').textContent = (pa / area * 100).toFixed(1) + '%'; $('waste').textContent = Math.max(0, 100 - pa / area * 100).toFixed(1) + '%'; const maxOv = res.placed.reduce((m, p) => Math.max(m, Math.max(0, Math.hypot(p.x + p.w / 2, p.y + p.h / 2) - res.R)), 0); $('over').textContent = maxOv.toFixed(1) + ' mm'; $('cuts').textContent = res.cuts;
            /* const counts = {}; res.placed.forEach(p => counts[p.name] = (counts[p.name] || 0) + 1); $('summary').innerHTML = `<table><tr><th>Wymiar</th><th>Ułożono</th><th>Orientacja</th></tr>${Object.entries(counts).map(([n, q]) => `<tr><td>${n}</td><td>${q}</td><td>0° / 90° automatycznie</td></tr>`).join('')}`; </table><p class="hint">Brązowe odcinki na schemacie oznaczają krawędzie, które algorytm stara się prowadzić jako wspólną linię cięcia.</p>`; */
            /*const seq = [...res.placed].sort((a, b) => Math.hypot(a.x, a.y) - Math.hypot(b.x, b.y));  $('sequence').innerHTML = `<table><tr><th>#</th><th>Deska</th><th>Od środka</th><th>Obrót</th></tr>${seq.map((p, i) => `<tr><td>${i + 1}</td><td>${p.name}</td><td>${Math.hypot(p.x, p.y).toFixed(0)} mm</td><td>${p.rot}°</td></tr>`).join('')}</table><p class="hint"><b>${res.cuts}</b> rzeczywistych linii cięcia • ${res.shared} połączonych krawędzi • łączna długość przejść piły: ${res.cutLength.toFixed(0)} mm.</p>`; draw(res) */
        }
        $('optimize').onclick = () => {const items = inputs(); if (!items.length) return alert('Dodaj przynajmniej jeden poprawny wymiar deski.'); $('optimize').disabled = true; setTimeout(() => {result = runSearch(items, $('quality').value); updateUI(result); $('optimize').disabled = false}, 20)};
        $('reset').onclick = () => location.reload();
        $('svg').onclick = () => {
            if (!result) return alert('Najpierw uruchom optymalizację.'); const res = result, S = 700, sc = (S - 60) / (res.D + 2 * res.allow), cx = S / 2, cy = S / 2; let z = `<svg xmlns="http://www.w3.org/2000/svg" width="${S}" height="${S}" viewBox="0 0 ${S} ${S}"><rect width="100%" height="100%" fill="white"/><circle cx="${cx}" cy="${cy}" r="${res.R * sc}" fill="#f3ead7" stroke="#334155" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="${(res.R + res.allow) * sc}" fill="none" stroke="#94a3b8" stroke-dasharray="7 5"/>`;
            res.placed.forEach(p => {const x = cx + (p.x - p.w / 2) * sc, y = cy + (p.y - p.h / 2) * sc; z += `<rect x="${x}" y="${y}" width="${p.w * sc}" height="${p.h * sc}" fill="#e4b66c" stroke="#475569"/><text x="${x + p.w * sc / 2}" y="${y + p.h * sc / 2}" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#1f2937">${p.name}</text>`}); z += '</svg>'; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([z], {type: 'image/svg+xml'})); a.download = 'uklad_pnia.svg'; a.click(); URL.revokeObjectURL(a.href)
        };
        (function () {const D = +$('diameter').value, R = D / 2, allow = D * (+$('overhang').value) / 100; draw({D, R, allow, kerf: +$('kerf').value, placed: [], plan: {vertical: [], horizontal: []}})})();
